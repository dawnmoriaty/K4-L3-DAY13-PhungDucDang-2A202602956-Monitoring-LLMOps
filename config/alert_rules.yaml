alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602956
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: error_rate_pct > 2.0%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: student-2A202602956
    runbook: docs/alerts.md#alert-2
  - name: CostSpikeAnomaly
    severity: warning
    condition: sum(cost_usd) > 2.5
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602956
    runbook: docs/alerts.md#alert-3

