service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: "SLO 99.5% trong chu kỳ 28 ngày dựa trên baseline P95 latency thực tế ~586.5ms (rất tốt so với ngưỡng 3000ms) và error rate 0%. Error budget 0.5% nghĩa là nếu workload có 10,000 requests thì tối đa 50 requests được phép bị lỗi hoặc phản hồi chậm hơn 3000ms."
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
